<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 그라데이션 정의 -->
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    
    <linearGradient id="sparkleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 배경 떠다니는 점들 -->
  <circle cx="20" cy="18" r="3" fill="#60A5FA" opacity="0.4">
    <animate attributeName="cy" values="18;22;18" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="76" cy="25" r="2.5" fill="#818CF8" opacity="0.3">
    <animate attributeName="cx" values="76;80;76" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="70" r="2" fill="#0EA5E9" opacity="0.5">
    <animate attributeName="cy" values="70;74;70" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="75" r="1.8" fill="#6366F1" opacity="0.3">
    <animate attributeName="cx" values="80;84;80" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="12" r="1.5" fill="#9333EA" opacity="0.4">
    <animate attributeName="cy" values="12;16;12" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 메인 로고 원형 배경 -->
  <circle cx="48" cy="48" r="32" fill="url(#mainGradient)" filter="url(#dropShadow)" rx="16"/>
  
  <!-- 바람 아이콘 (Wind lines) -->
  <g transform="translate(28, 35)">
    <!-- 첫 번째 바람 라인 -->
    <path d="M4 8 L32 8 C34.2 8 36 6.2 36 4 C36 1.8 34.2 0 32 0 L20 0 C17.8 0 16 1.8 16 4 C16 6.2 17.8 8 20 8 L28 8 C29.1 8 30 8.9 30 10 C30 11.1 29.1 12 28 12 L4 12 C2.9 12 2 11.1 2 10 C2 8.9 2.9 8 4 8 Z" 
          fill="white" opacity="0.9"/>
    
    <!-- 두 번째 바람 라인 -->
    <path d="M4 18 L24 18 C26.2 18 28 16.2 28 14 C28 11.8 26.2 10 24 10 L16 10 C13.8 10 12 11.8 12 14 C12 16.2 13.8 18 16 18 L20 18 C21.1 18 22 18.9 22 20 C22 21.1 21.1 22 20 22 L4 22 C2.9 22 2 21.1 2 20 C2 18.9 2.9 18 4 18 Z" 
          fill="white" opacity="0.7"/>
    
    <!-- 세 번째 바람 라인 -->
    <path d="M4 28 L20 28 C22.2 28 24 26.2 24 24 C24 21.8 22.2 20 20 20 L12 20 C9.8 20 8 21.8 8 24 C8 26.2 9.8 28 12 28 L16 28 C17.1 28 18 28.9 18 30 C18 31.1 17.1 32 16 32 L4 32 C2.9 32 2 31.1 2 30 C2 28.9 2.9 28 4 28 Z" 
          fill="white" opacity="0.5"/>
  </g>
  
  <!-- 스파클 아이콘 -->
  <circle cx="70" cy="26" r="10" fill="url(#sparkleGradient)" filter="url(#glow)">
    <animate attributeName="r" values="10;12;10" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 스파클 별 모양 -->
  <g transform="translate(62, 18)">
    <path d="M8 2 L9.5 6.5 L14 8 L9.5 9.5 L8 14 L6.5 9.5 L2 8 L6.5 6.5 Z" 
          fill="white" filter="url(#glow)">
      <animateTransform attributeName="transform" 
                        attributeType="XML" 
                        type="rotate" 
                        from="0 8 8" 
                        to="360 8 8" 
                        dur="4s" 
                        repeatCount="indefinite"/>
    </path>
  </g>
</svg>
